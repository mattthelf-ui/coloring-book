<title>Coloring Book</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22Coloring%20Book%22%2C%20%22short_name%22%3A%20%22Coloring%22%2C%20%22display%22%3A%20%22fullscreen%22%2C%20%22orientation%22%3A%20%22any%22%2C%20%22background_color%22%3A%20%22%23ffffff%22%2C%20%22theme_color%22%3A%20%22%237048e8%22%2C%20%22start_url%22%3A%20%22.%22%7D">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#7048e8">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;touch-action:manipulation;overscroll-behavior:none}
body{font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:linear-gradient(160deg,#ffe066,#ff9ff3 55%,#74c0fc);display:flex;flex-direction:column;align-items:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));gap:10px}
header{display:flex;width:100%;max-width:640px;justify-content:space-between;align-items:center}
h1{margin:0;font-size:clamp(22px,6vw,34px);color:#fff;text-shadow:2px 2px 0 #e64980,4px 4px 0 #5c3cc4}
#reset{font:inherit;font-size:clamp(18px,5vw,24px);font-weight:bold;border:none;border-radius:999px;padding:14px 24px;min-height:60px;background:#ff6b6b;color:#fff;box-shadow:0 5px 0 #c92a2a;touch-action:manipulation}
#reset:active{transform:translateY(4px);box-shadow:0 1px 0 #c92a2a}
#wrap{flex:1 1 auto;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
#wrap{position:relative}
#vp{position:relative;overflow:hidden;background:#fff;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.2);touch-action:none;cursor:crosshair}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#cv,#ol{position:absolute;inset:0;width:100%;height:100%;display:block}
#ol{pointer-events:none}
#zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:8px;z-index:2}
#zoom button{width:56px;height:56px;border-radius:50%;border:none;font:inherit;font-size:30px;font-weight:bold;color:#fff;background:#7048e8;box-shadow:0 4px 0 #4527a0;touch-action:manipulation;line-height:1}
#zoom button#zfit{font-size:16px;background:#20c997;box-shadow:0 4px 0 #087f5b}
#zoom button:active{transform:translateY(3px);box-shadow:none}
#pal{width:100%;max-width:640px;background:#fff;border-radius:26px;padding:10px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
#sw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
#sw::-webkit-scrollbar{display:none}
.s{flex:0 0 33.3333%;scroll-snap-align:start;padding:14px 10px;display:flex;justify-content:center}
.s button{width:100%;max-width:150px;height:clamp(64px,16vw,96px);border-radius:22px;border:4px solid rgba(0,0,0,.15);cursor:pointer;transition:transform .12s}
.s button.on{border:6px solid #222;transform:scale(1.06);box-shadow:0 0 0 5px #fff,0 0 0 9px #222}
@media (orientation:landscape) and (max-height:600px){body{flex-direction:row;flex-wrap:wrap}}
#pick{display:flex;gap:10px;width:100%;max-width:640px;overflow-x:auto;scrollbar-width:none;padding:6px 4px;touch-action:pan-x}
#pick::-webkit-scrollbar{display:none}
#pick button{flex:1 0 76px;max-width:150px;min-height:96px;background:#fff;border:4px solid #fff;border-radius:18px;padding:4px;display:flex;flex-direction:column;align-items:center;font:inherit;font-weight:bold;font-size:13px;color:#333;box-shadow:0 4px 0 rgba(0,0,0,.18);position:relative}
#pick button img{height:58px;width:auto;pointer-events:none}
#pick{padding-top:14px}#pick button em{position:absolute;top:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#7048e8;color:#fff;font-style:normal;font-size:11px;padding:2px 7px;border-radius:999px}
#pick button.on{border-color:#7048e8;background:#f3f0ff;transform:translateY(-2px)}
/* ---- 80% layout ---- */
html,body{height:100dvh;overflow:hidden}
body{display:grid;padding:0;gap:0;grid-template-columns:100%;grid-template-rows:minmax(0,1fr) 80dvh auto;grid-template-areas:"top" "wrap" "pal"}
#top{grid-area:top;display:flex;align-items:stretch;gap:6px;padding:2px 6px;min-height:0}
#pick{flex:1;display:flex;gap:6px;padding:11px 0 2px;max-width:none;overflow-x:auto;min-height:0}
#pick button{flex:1 1 0;min-width:44px;max-width:none;min-height:44px;max-height:64px;flex-direction:row;justify-content:center;gap:4px;padding:2px 4px;border-width:3px;border-radius:12px;font-size:clamp(10px,2.6vw,15px);line-height:1.05;box-shadow:0 2px 0 rgba(0,0,0,.18)}
#pick button img{height:36px;max-height:52px}
#pick button em{top:-11px;font-size:10px;padding:1px 6px}
#pick button.on{transform:none}
#reset{flex:0 0 auto;align-self:center;min-height:44px;padding:0 12px;font-size:clamp(13px,3.4vw,20px);box-shadow:0 3px 0 #c92a2a;margin-top:9px}
#wrap{grid-area:wrap;width:100%;height:100%;min-height:0;display:block;position:relative}
#vp{position:absolute;inset:0;border-radius:0;box-shadow:none}
#pal{grid-area:pal;max-width:none;width:100%;border-radius:0;padding:0 8px env(safe-area-inset-bottom);box-shadow:none}
.s{padding:5px 6px}
.s button{max-width:none;height:clamp(44px,6dvh,84px);border-radius:16px}
.s button.on{transform:none;border-width:5px;box-shadow:0 0 0 3px #fff,0 0 0 6px #222}
@media (orientation:portrait) and (max-width:500px){#pick button span{font-size:10px}#pick button{flex-direction:column;gap:0}#pick button img{height:24px}}
@media (orientation:landscape){
 body{grid-template-columns:80vw 20vw;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"wrap top" "wrap pal"}
 #wrap{height:100dvh}
 #top{flex-direction:column;padding:4px}
 #pick{display:grid;grid-template-columns:1fr 1fr;padding-top:12px;overflow:visible}
 #pick button{flex-direction:column;height:44px}
 #pick button img{height:30px}
 #pick button span{display:none}
 #reset{align-self:stretch;margin:0}
 #pal{padding:4px}
 .s{padding:4px 3px}.s button{height:clamp(44px,10dvh,80px)}
}
/* ---- 3-row palette ---- */
body{grid-template-rows:auto minmax(0,1fr) auto}
#top{padding:0 6px 2px}
#pick{padding-top:11px}
#pick button{min-height:44px;max-height:48px}
#sw{display:grid;grid-template-rows:repeat(3,auto);grid-auto-flow:row;grid-template-columns:repeat(6,calc(100%/3));scroll-snap-type:x mandatory;padding:4px 0}
.s{padding:2px 4px}
.s{scroll-snap-align:none}

.s button{height:40px;border-radius:12px;border-width:3px}
.s button.on{border-width:4px;box-shadow:0 0 0 2px #fff,0 0 0 4px #222}
@media (min-width:700px) and (orientation:portrait){.s button{height:48px}}
@media (orientation:landscape){body{grid-template-rows:auto minmax(0,1fr)}#sw{grid-template-columns:repeat(6,calc(100%/3))}.s button{height:40px}}
/* ---- kid mode ---- */
#kidon{flex:0 0 auto;align-self:center;margin-top:9px;width:44px;height:44px;border-radius:50%;border:none;background:#fff;font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.2);padding:0}
#kidlock{display:none;position:fixed;top:calc(4px + env(safe-area-inset-top));left:4px;width:44px;height:44px;padding:0;border:none;background:rgba(255,255,255,.85);border-radius:50%;z-index:10;touch-action:none;opacity:.7}
#kidlock svg{position:absolute;inset:0;width:100%;height:100%}
#kidlock span{position:relative;font-size:18px;line-height:44px}
body.kid #kidlock{display:block}
body.kid #top{display:none}
body.kid{grid-template-rows:0 minmax(0,1fr) auto}
@media (orientation:landscape){body.kid{grid-template-rows:0 minmax(0,1fr)}body.kid #pal{grid-row:1 / span 2;align-self:center}}
body.kid,body.kid *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.kid,body.kid{overscroll-behavior:none;touch-action:none;position:fixed;inset:0;width:100%}
body.kid #sw{touch-action:pan-x}
/* ---- no slider; bottom safe zone ---- */
#dots{display:flex;justify-content:center;gap:8px;height:12px;align-items:center;pointer-events:none}
#dots i{width:8px;height:8px;border-radius:50%;background:#ccc}#dots i.on{background:#7048e8}
#safe{height:calc(68px + env(safe-area-inset-bottom));pointer-events:none}
#pal{padding-bottom:0!important}
#pal,#sw{pointer-events:auto}
@media (orientation:landscape){#safe{height:calc(68px + env(safe-area-inset-bottom))}#pal{align-self:stretch;display:flex;flex-direction:column}}
</style></head><body>
